<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>

<VirtualHost *:8080>
    ServerName report.assetloan.my.id
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    Header always unset X-Powered-By
    Header onsuccess unset X-Powered-By

    KeepAlive On
    KeepAliveTimeout 2
    MaxKeepAliveRequests 50

    ErrorLog ${APACHE_LOG_DIR}/laporin-error.log
    CustomLog ${APACHE_LOG_DIR}/laporin-access.log combined
</VirtualHost>

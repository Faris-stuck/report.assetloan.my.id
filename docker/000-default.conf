# Prefork + mod_php: satu worker sama dengan satu proses PHP utuh
# (terukur ~45 MB di produksi). Batas lama 4 worker membuat origin hanya
# sanggup melayani 4 permintaan dinamis sekaligus, sisanya menunggu di
# backlog sampai timeout. 16 worker (~720 MB) masih aman di mesin 3,7 GB
# ini dan memberi ruang antre ketika trafik melonjak.
<IfModule mpm_prefork_module>
    StartServers 4
    MinSpareServers 4
    MaxSpareServers 8
    MaxRequestWorkers 16
    MaxConnectionsPerChild 500
</IfModule>

<VirtualHost *:8080>
    ServerName report.assetloan.my.id
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    Header always unset X-Powered-By
    Header onsuccess unset X-Powered-By

    # Pada prefork, koneksi keep-alive yang menganggur tetap menahan satu
    # proses PHP utuh. Cloudflare Tunnel menghubungi origin lewat jaringan
    # docker lokal tanpa TLS, jadi membuka koneksi baru nyaris tanpa biaya
    # sedangkan worker yang tertahan sangat mahal. Matikan keep-alive supaya
    # worker langsung bebas dipakai permintaan berikutnya.
    KeepAlive Off

    # Aset statis dilayani Apache langsung tanpa melewati PHP. Cache-Control
    # membuat Cloudflare menyimpannya di edge sehingga origin tidak tersentuh
    # saat trafik melonjak. Nama file belum ber-hash konten, jadi TTL css/js
    # ditahan pendek agar rilis baru tetap sampai ke pengguna dengan cepat.
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "public, max-age=3600, stale-while-revalidate=86400"
    </FilesMatch>
    <FilesMatch "\.(png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/laporin-error.log
    CustomLog ${APACHE_LOG_DIR}/laporin-access.log combined
</VirtualHost>

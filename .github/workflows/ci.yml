name: CI

on:
  push: {}
  pull_request: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: PHP CS Fixer (check)
        run: if [ -f vendor/bin/php-cs-fixer ]; then vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php; fi

      - name: PHPStan
        run: if [ -f vendor/bin/phpstan ]; then vendor/bin/phpstan analyse -c phpstan.neon || true; fi

      - name: Run tests
        run: php artisan test

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Komatsu Group Indonesia | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://webassets.komatsugroup.id/favicon.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #03051f, #05082b 60%, #0a0f4a);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            padding: 40px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            text-align: center;
        }

        .logo img {
            width: 160px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #111827;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 28px;
            color: #111827;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #f5f7ff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1e3a8a;
            background: #ffffff;
        }

        .password-wrapper {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: #1e3a8a;
            cursor: pointer;
            user-select: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1e3a8a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
        }

        .login-btn:hover {
            background: #162f6a;
        }

        .forgot {
            margin-top: 14px;
            display: block;
            font-size: 14px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 500;
        }

        .footer {
            margin-top: 26px;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">
            <!-- Ganti src sesuai lokasi logo kamu -->
            <img src="assets/images/Komatsu-Logo-removebg-preview.png" alt="Komatsu Logo">
        </div>

        <div class="title">Komatsu Group Indonesia</div>
        <!-- <div class="subtitle">Business Partner Portal</div>-->

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" name="email" placeholder="email" required>
            </div>

            <div class="form-group password-wrapper">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="********" required>
                <span class="show-password" onclick="togglePassword()">show</span>
            </div>

            <div class="w-100 mt-4 pt-2">
                <button type="submit" class="login-btn">Log in</button>
            </div>

        </form>

        <a href="forgot-password.html" class="forgot">Forgot password</a>
        <a href="register.html" class="forgot">Don't have an account? Register here</a>

        <div class="footer">
            1.2.260112-04 © 2024 - ICT Komatsu Indonesia
        </div>
    </div>

    <script src="assets/js/base-url.js"></script>
    <script>
        /**
         * ============================================
         * SESSION CHECK: Auto-redirect jika sudah login
         * Cek server session dulu, baru localStorage
         * ============================================
         */
        (function checkExistingSession() {
            var userStr = localStorage.getItem('user');
            if (!userStr) return;

            try {
                var user = JSON.parse(userStr);
                if (!user || !user.id || !user.role) {
                    localStorage.removeItem('user');
                    return;
                }

                // Verifikasi session di server secara SINKRON
                // agar halaman login tidak sempat muncul jika sudah login
                var xhr = new XMLHttpRequest();
                xhr.open('POST', BASE_URL + '/api/auth/verify-session.php', false); // synchronous
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.withCredentials = true;
                xhr.send(JSON.stringify({ user_id: user.id, user_role: user.role }));

                if (xhr.status === 200) {
                    // Session server valid, redirect ke dashboard sesuai role
                    redirectToDashboard(user.role);
                } else {
                    // Session server tidak valid, hapus localStorage
                    localStorage.removeItem('user');
                    sessionStorage.clear();
                }
            } catch (e) {
                // Error parsing atau network, biarkan tetap di halaman login
                localStorage.removeItem('user');
            }
        })();

        /**
         * Redirect ke dashboard berdasarkan role
         */
        function redirectToDashboard(role) {
            switch (role) {
                case 'admin':
                    window.location.replace(BASE_URL + '/admin/dashboard.html');
                    break;
                case 'manager':
                    window.location.replace(BASE_URL + '/manager/dashboard.html');
                    break;
                case 'pic_barang':
                    window.location.replace(BASE_URL + '/pic-barang/dashboard.html');
                    break;
                case 'user':
                default:
                    window.location.replace(BASE_URL + '/user/dashboard.html');
                    break;
            }
        }

        function togglePassword() {
            const input = document.getElementById("password");
            const text = event.target;

            if (input.type === "password") {
                input.type = "text";
                text.innerText = "hide";
            } else {
                input.type = "password";
                text.innerText = "show";
            }
        }

        // Login handler
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const loginBtn = document.querySelector('.login-btn');

            if (!email || !password) {
                alert("Email dan password harus diisi");
                return;
            }

            // Disable button saat proses login
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            const formData = new FormData();
            formData.append("email", email);
            formData.append("password", password);

            try {
                const res = await fetch(BASE_URL + "/api/auth/login.php", {
                    method: "POST",
                    credentials: "include", // PENTING: kirim session cookie
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    alert(err.error || "Login gagal. Periksa email/password Anda.");
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Log in';
                    return;
                }

                const data = await res.json();

                // Simpan user info ke localStorage (sebagai cache, session server = sumber kebenaran)
                localStorage.setItem("user", JSON.stringify(data));

                // Redirect berdasarkan role dari SERVER (bukan dari input user)
                redirectToDashboard(data.role);

            } catch (error) {
                alert("Terjadi kesalahan koneksi ke server.");
                console.error(error);
                loginBtn.disabled = false;
                loginBtn.textContent = 'Log in';
            }
        });
    </script>

</body>

</html>

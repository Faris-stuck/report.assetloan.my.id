    <script>
        // Store chart instances globally
        let statusChartInstance = null;
        let inventoryChartInstance = null;
        let itemDataChartInstance = null;

        // Load Dashboard Statistics
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(BASE_URL + '/api/pic_barang/dashboard-chart-data.php');
                const result = await response.json();

                if (result.status && result.data) {
                    const data = result.data;

                    // Render Status Peminjaman Chart (dynamic from DB)
                    const statusData = {};
                    (data.per_status || []).forEach(row => {
                        if (row.status) statusData[row.status] = row.total;
                    });
                    if (Object.keys(statusData).length === 0) {
                        statusData['Menunggu Persetujuan'] = data.menunggu_persetujuan || 0;
                        statusData['Sedang Dipinjam'] = data.sedang_dipinjam || 0;
                        statusData['Dikembalikan'] = data.dikembalikan || 0;
                        statusData['Ditolak'] = data.ditolak || 0;
                    }
                    renderStatusChart(statusData);

                    // Populate kategori filter dropdown
                    const categories = data.categories || [];
                    if (categories.length > 0) {
                        const topKategoriList = document.getElementById('topKategoriList');
                        const dataBarangList = document.getElementById('dataBarangList');

                        topKategoriList.innerHTML = categories.map(cat => `
                            <a class="dropdown-item" href="#" onclick="selectTopKategori('${cat}'); return false;">
                                <small>${cat}</small>
                            </a>
                        `).join('');

                        const topBarangNames = (data.top_barang || []).map(item => item.nama);
                        const allBarangNames = (data.all_barang || []).map(item => item.nama);
                        const uniqueBarangNames = [...new Set([...topBarangNames, ...allBarangNames])];

                        dataBarangList.innerHTML = uniqueBarangNames.map(nama => `
                            <a class="dropdown-item" href="#" onclick="selectDataBarang('${nama}'); return false;">
                                <small>${nama}</small>
                            </a>
                        `).join('');

                        setupTopKategoriSearch(categories);
                        setupDataBarangSearch(uniqueBarangNames);
                    }

                    // Render Inventory Chart
                    const topBarang = data.top_barang || [];
                    if (topBarang.length > 0) {
                        renderInventoryChart(topBarang);
                    } else {
                        document.getElementById('inventoryChart').innerHTML =
                            '<div class="text-center text-muted py-5">No borrowing data yet</div>';
                    }

                    // Render Item Data Chart
                    const allBarang = data.all_barang || [];
                    if (allBarang.length > 0) {
                        renderItemDataChart(allBarang);
                    } else {
                        document.getElementById('itemDataChart').innerHTML =
                            '<div class="text-center text-muted py-5">No item data yet</div>';
                    }
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        });

        // Returns a consistent color for each known borrowing status
        function getStatusColor(status) {
            const colorMap = {
                'Menunggu Persetujuan': '#FFC107',
                'Partial Approved': '#17A2B8',
                'Disetujui': '#0D6EFD',
                'Menunggu Admin': '#6C757D',
                'Menunggu Approver': '#6C757D',
                'Sedang Dipinjam': '#3F83F8',
                'Sebagian Dikembalikan': '#20C997',
                'Proses Return': '#6F42C1',
                'Dikembalikan': '#28A745',
                'Sebagian Rusak': '#FD7E14',
                'Semua Rusak': '#DC3545',
                'Selesai': '#198754',
                'Ditolak': '#DC3545',
                'Batal': '#868E96',
                'Overdue': '#DC3545',
                'Due Today': '#FF4444',
                'Due Tomorrow': '#FD7E14',
                'Due 2 Day': '#FFB900',
                'Due 3 Day': '#FFC107',
                'Due 4 Day': '#CDDC39',
                'Due 5 Day': '#8BC34A',
                'Due 6 Day': '#4CAF50',
                'Due 7 Day': '#198754',
                'Borrowed': '#3F83F8',
                'Returned': '#28A745',
                'Rejected': '#DC3545',
                'Partially Returned': '#20C997'
            };
            if (colorMap[status]) return colorMap[status];
            return '#6C757D';
        }

        // Chart: Status Peminjaman
        function renderStatusChart(statusData) {
            if (statusChartInstance) {
                statusChartInstance.destroy();
                statusChartInstance = null;
            }

            const labels = Object.keys(statusData);
            const values = Object.values(statusData);
            const colors = labels.map(getStatusColor);

            const options = {
                chart: {
                    type: 'bar',
                    height: 350,
                    fontFamily: 'inherit',
                    toolbar: { show: true }
                },
                colors: colors,
                series: [{
                    name: '',
                    data: values
                }],
                xaxis: {
                    categories: labels,
                    labels: {
                        style: { fontSize: '12px' }
                    }
                },
                yaxis: {
                    title: { text: 'Quantity' },
                    labels: { formatter: val => Math.floor(val) }
                },
                dataLabels: {
                    enabled: true,
                    formatter: val => Math.floor(val)
                },
                plotOptions: {
                    bar: {
                        horizontal: false,
                        columnWidth: '60%',
                        distributed: true,
                        dataLabels: { position: 'top' }
                    }
                },
                tooltip: {
                    y: {
                        formatter: (val, { series, seriesIndex, dataPointIndex, w }) => {
                            const categories = w.config.xaxis.categories;
                            const statusLabel = categories[dataPointIndex];
                            return `Quantity ${statusLabel}: ${val}`;
                        }
                    }
                }
            };

            if (window.ApexCharts) {
                statusChartInstance = new ApexCharts(document.querySelector('#statusChart'), options);
                statusChartInstance.render();
            }
        }

        // Chart: Top Barang Dipinjam
        function renderInventoryChart(topBarang) {
            if (inventoryChartInstance) {
                inventoryChartInstance.destroy();
                inventoryChartInstance = null;
            }

            const names = topBarang.map(item => item.nama);
            const peminjaman = topBarang.map(item => parseInt(item.jumlah_peminjaman) || 0);
            const stokTersedia = topBarang.map(item => parseInt(item.stok_tersedia) || 0);

            const options = {
                chart: {
                    type: 'bar',
                    height: 350,
                    fontFamily: 'inherit',
                    toolbar: { show: true }
                },
                colors: ['#3B5998', '#66BB6A'],
                series: [
                    { name: 'Borrowed', data: peminjaman },
                    { name: 'Available', data: stokTersedia }
                ],
                xaxis: {
                    categories: names,
                    labels: { style: { fontSize: '12px' } }
                },
                yaxis: {
                    title: { text: 'Quantity' },
                    labels: { formatter: val => Math.floor(val) }
                },
                dataLabels: {
                    enabled: true,
                    formatter: val => Math.floor(val)
                },
                plotOptions: {
                    bar: {
                        horizontal: false,
                        columnWidth: '55%',
                        dataLabels: { position: 'top' }
                    }
                },
                tooltip: {
                    y: { formatter: val => val + ' unit' }
                },
                legend: {
                    position: 'top',
                    horizontalAlign: 'right'
                }
            };

            if (window.ApexCharts) {
                inventoryChartInstance = new ApexCharts(document.querySelector('#inventoryChart'), options);
                inventoryChartInstance.render();
            }
        }

        // Chart: Data Barang Status
        function renderItemDataChart(allBarang) {
            if (itemDataChartInstance) {
                itemDataChartInstance.destroy();
                itemDataChartInstance = null;
            }

            const names = allBarang.map(item => item.nama);
            const peminjaman = allBarang.map(item => parseInt(item.jumlah_peminjaman) || 0);
            const stokTersedia = allBarang.map(item => parseInt(item.stok_tersedia) || 0);

            const options = {
                chart: {
                    type: 'bar',
                    height: 350,
                    fontFamily: 'inherit',
                    toolbar: { show: true }
                },
                colors: ['#3B5998', '#66BB6A'],
                series: [
                    { name: 'Borrowed', data: peminjaman },
                    { name: 'Available', data: stokTersedia }
                ],
                xaxis: {
                    categories: names,
                    labels: { style: { fontSize: '12px' } }
                },
                yaxis: {
                    title: { text: 'Quantity' },
                    labels: { formatter: val => Math.floor(val) }
                },
                dataLabels: {
                    enabled: true,
                    formatter: val => Math.floor(val)
                },
                plotOptions: {
                    bar: {
                        horizontal: false,
                        columnWidth: '55%',
                        dataLabels: { position: 'top' }
                    }
                },
                tooltip: {
                    y: { formatter: val => val + ' unit' }
                },
                legend: {
                    position: 'top',
                    horizontalAlign: 'right'
                }
            };

            if (window.ApexCharts) {
                itemDataChartInstance = new ApexCharts(document.querySelector('#itemDataChart'), options);
                itemDataChartInstance.render();
            }
        }

        // ===== FILTER 1: TOP BARANG DIPINJAM (Kategori) =====
        let selectedKategoriTopBarang = 'all';

        async function selectTopKategori(kategori) {
            selectedKategoriTopBarang = kategori || 'all';
            document.getElementById('topKategoriSelected').textContent =
                kategori === 'all' ? 'All Categories' : kategori;
            const dropdownBtn = document.getElementById('topKategoriDropdownBtn');
            const dropdown = bootstrap.Dropdown.getInstance(dropdownBtn);
            if (dropdown) dropdown.hide();
            await updateTopBarangChart(kategori);
        }

        // ===== FILTER 2: DATA BARANG (Nama Barang) =====
        let selectedNamaBarangDataBarang = 'all';

        async function selectDataBarang(namaBarang) {
            selectedNamaBarangDataBarang = namaBarang || 'all';
            document.getElementById('dataBarangSelected').textContent =
                namaBarang === 'all' ? 'All Items' : namaBarang;
            const dropdownBtn = document.getElementById('dataBarangDropdownBtn');
            const dropdown = bootstrap.Dropdown.getInstance(dropdownBtn);
            if (dropdown) dropdown.hide();
            await updateDataBarangChart(namaBarang);
        }

        function setupTopKategoriSearch(categories) {
            const searchInput = document.getElementById('topKategoriSearch');
            const kategoriBtnContainer = document.getElementById('topKategoriList');
            if (!searchInput) return;
            searchInput.addEventListener('input', function () {
                const searchValue = this.value.toLowerCase();
                kategoriBtnContainer.querySelectorAll('.dropdown-item').forEach(item => {
                    item.style.display = item.textContent.toLowerCase().includes(searchValue) ? 'block' : 'none';
                });
            });
        }

        function setupDataBarangSearch(barangNames) {
            const searchInput = document.getElementById('dataBarangSearch');
            const barangBtnContainer = document.getElementById('dataBarangList');
            if (!searchInput) return;
            searchInput.addEventListener('input', function () {
                const searchValue = this.value.toLowerCase();
                barangBtnContainer.querySelectorAll('.dropdown-item').forEach(item => {
                    item.style.display = item.textContent.toLowerCase().includes(searchValue) ? 'block' : 'none';
                });
            });
        }

        // UPDATE Top Barang Chart by kategori
        async function updateTopBarangChart(kategori) {
            try {
                let url = BASE_URL + '/api/pic_barang/dashboard-chart-data.php';
                if (kategori && kategori !== 'all') {
                    url += '?kategori=' + encodeURIComponent(kategori);
                }
                const response = await fetch(url);
                const result = await response.json();
                if (result.status && result.data) {
                    const topBarang = result.data.top_barang || [];
                    if (topBarang.length > 0) {
                        renderInventoryChart(topBarang);
                    } else {
                        document.getElementById('inventoryChart').innerHTML =
                            '<div class="text-center text-muted py-5">No data for selected category</div>';
                    }
                }
            } catch (error) {
                console.error('Error updating Top Barang chart:', error);
            }
        }

        // UPDATE Data Barang Chart by nama barang
        async function updateDataBarangChart(namaBarang) {
            try {
                const response = await fetch(BASE_URL + '/api/pic_barang/dashboard-chart-data.php');
                const result = await response.json();
                if (result.status && result.data) {
                    let allBarang = result.data.all_barang || [];
                    if (namaBarang && namaBarang !== 'all') {
                        allBarang = allBarang.filter(item => item.nama === namaBarang);
                    }
                    if (allBarang.length > 0) {
                        renderItemDataChart(allBarang);
                    } else {
                        document.getElementById('itemDataChart').innerHTML =
                            '<div class="text-center text-muted py-5">No data for selected item</div>';
                    }
                }
            } catch (error) {
                console.error('Error updating Data Barang chart:', error);
            }
        }

        // ===== DATE RANGE FILTER FOR STATUS PEMINJAMAN =====
        let startDateStatus = null;
        let endDateStatus = null;

        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(initStatusReportRangePicker, 500);
        });

        function initStatusReportRangePicker() {
            if (typeof jQuery === 'undefined' || typeof moment === 'undefined' ||
                typeof $.fn.daterangepicker === 'undefined') {
                return;
            }

            var start = moment().clone().subtract(29, 'days');
            var end = moment();

            $('#reportrangeStatus').daterangepicker({
                startDate: start,
                endDate: end,
                locale: { format: 'YYYY-MM-DD' },
                ranges: {
                    'Today': [moment(), moment()],
                    'Yesterday': [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
                    'Last 7 Days': [moment().subtract(6, 'days'), moment()],
                    'Last 30 Days': [moment().subtract(29, 'days'), moment()],
                    'This Month': [moment().startOf('month'), moment().endOf('month')],
                    'Last Month': [moment().subtract(1, 'month').startOf('month'), moment().subtract(1, 'month').endOf('month')],
                    'All Time': [moment('2020-01-01'), moment()]
                }
            });

            document.querySelector('#reportrangeStatus .reportrange-picker-field').innerHTML =
                start.format('MMM D, YY') + ' - ' + end.format('MMM D, YY');

            startDateStatus = start.format('YYYY-MM-DD');
            endDateStatus = end.format('YYYY-MM-DD');
            updateStatusChartByDateRange();

            $('#reportrangeStatus').on('apply.daterangepicker', function (ev, picker) {
                startDateStatus = picker.startDate.format('YYYY-MM-DD');
                endDateStatus = picker.endDate.format('YYYY-MM-DD');
                document.querySelector('#reportrangeStatus .reportrange-picker-field').innerHTML =
                    picker.startDate.format('MMM D, YY') + ' - ' + picker.endDate.format('MMM D, YY');
                updateStatusChartByDateRange();
            });

            document.getElementById('btnResetDateStatus').addEventListener('click', function () {
                var newStart = moment().clone().subtract(29, 'days');
                var newEnd = moment();
                $('#reportrangeStatus').data('daterangepicker').setStartDate(newStart);
                $('#reportrangeStatus').data('daterangepicker').setEndDate(newEnd);
                document.querySelector('#reportrangeStatus .reportrange-picker-field').innerHTML =
                    newStart.format('MMM D, YY') + ' - ' + newEnd.format('MMM D, YY');
                startDateStatus = newStart.format('YYYY-MM-DD');
                endDateStatus = newEnd.format('YYYY-MM-DD');
                updateStatusChartByDateRange();
            });
        }

        async function updateStatusChartByDateRange() {
            try {
                let url = BASE_URL + '/api/pic_barang/dashboard-chart-data.php';
                const params = new URLSearchParams();
                if (startDateStatus) params.append('tanggal_awal', startDateStatus);
                if (endDateStatus) params.append('tanggal_akhir', endDateStatus);
                if (params.toString()) url += '?' + params.toString();

                const response = await fetch(url);
                const result = await response.json();
                if (result.status && result.data) {
                    const statusData = {};
                    (result.data.per_status || []).forEach(row => {
                        if (row.status) statusData[row.status] = row.total;
                    });
                    if (Object.keys(statusData).length === 0) {
                        statusData['Menunggu Persetujuan'] = result.data.menunggu_persetujuan || 0;
                        statusData['Sedang Dipinjam'] = result.data.sedang_dipinjam || 0;
                        statusData['Dikembalikan'] = result.data.dikembalikan || 0;
                        statusData['Ditolak'] = result.data.ditolak || 0;
                    }
                    renderStatusChart(statusData);
                }
            } catch (error) {
                console.error('Error updating Status chart by date range:', error);
            }
        }
    </script>

    <script src="../assets/vendors/js/daterangepicker.min.js"></script>
    <!--! END: Vendors JS for DateRangePicker !-->

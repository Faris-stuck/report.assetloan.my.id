    <script>if (typeof RoleValidator !== 'undefined') RoleValidator.requirePicBarang();</script>
    <script src="../assets/vendors/js/vendors.min.js"></script>

    <script>
        const userData = RoleValidator.getUser();
        if (userData.nama) document.getElementById('header-nama').textContent = userData.nama;
        if (userData.email) document.getElementById('header-email').textContent = userData.email;
        if (userData.nama) document.getElementById('profil-nama').textContent = userData.nama;
        if (userData.email) document.getElementById('profil-email').textContent = userData.email;
        if (userData.nrp) document.getElementById('profil-nrp').textContent = 'NRP: ' + userData.nrp;
        if (userData.avatar) {
            const avatarUrl = (userData.avatar.indexOf('http') === 0) ? userData.avatar : ('/PROJECT/' + userData.avatar);
            document.getElementById('profileAvatar').src = avatarUrl;
            if (window.RoleValidator && RoleValidator.applyAvatar) RoleValidator.applyAvatar();
        }

        fetch('../api/pic_barang/profile.php', { credentials: 'same-origin' })
            .then(r => r.json())
            .then(res => {
                if (res.status && res.data) {
                    const d = res.data;
                    document.getElementById('profil-nama').textContent = d.nama;
                    document.getElementById('profil-email').textContent = d.email;
                    document.getElementById('profil-nrp').textContent = 'NRP: ' + (d.nrp || '-');
                    if (d.avatar) {
                        const avatarUrl = (d.avatar.indexOf('http') === 0) ? d.avatar : ('/PROJECT/' + d.avatar);
                        document.getElementById('profileAvatar').src = avatarUrl;
                        try { const lu = JSON.parse(localStorage.getItem('user') || '{}'); lu.avatar = d.avatar; localStorage.setItem('user', JSON.stringify(lu)); } catch (e) { }
                        if (window.RoleValidator && RoleValidator.applyAvatar) RoleValidator.applyAvatar();
                    }
                }
            })
            .catch(() => { });

        // Upload avatar
        document.getElementById('btnUploadAvatar').addEventListener('click', function () {
            const f = document.getElementById('inputAvatar').files[0];
            if (!f) return alert('Select an image first');
            const fd = new FormData(); fd.append('avatar', f);
            fetch('/PROJECT/api/user/upload-avatar.php', { method: 'POST', body: fd, credentials: 'same-origin' })
                .then(r => r.json())
                .then(res => {
                    if (res.status && res.avatar) {
                        const avatarUrl = '/PROJECT/' + res.avatar;
                        document.getElementById('profileAvatar').src = avatarUrl;
                        try { const lu = JSON.parse(localStorage.getItem('user') || '{}'); lu.avatar = res.avatar; localStorage.setItem('user', JSON.stringify(lu)); } catch (e) { }
                        if (window.RoleValidator && RoleValidator.applyAvatar) RoleValidator.applyAvatar();
                        alert('Avatar updated');
                    } else {
                        alert(res.message || 'Upload failed');
                    }
                })
                .catch(() => alert('Upload error'));
        });
    </script>

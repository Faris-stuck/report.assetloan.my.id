    <script>
        const userData = RoleValidator.getUser();
        if (userData.nama) document.getElementById('profil-nama').textContent = userData.nama;
        if (userData.email) document.getElementById('profil-email').textContent = userData.email;
        if (userData.nrp) document.getElementById('profil-nrp').textContent = userData.nrp;

        fetch(BASE_URL + '/api/pic_barang/profile.php', { credentials: 'same-origin' })
            .then(r => r.json())
            .then(res => {
                if (res.status && res.data) {
                    const d = res.data;
                    document.getElementById('profil-nama').textContent = d.nama;
                    document.getElementById('profil-email').textContent = d.email;
                    document.getElementById('profil-nrp').textContent = d.nrp || '-';
                }
            })
            .catch(() => { });
    </script>

        const userData = RoleValidator.getUser();

        if (userData.email) document.getElementById('header-email').textContent = userData.email;

    <script>
        const API = '../../api/pic_barang';
        function loadBarang() {
            fetch(API + '/barang-get.php', { credentials: 'same-origin' })
                .then(r => r.json())
                .then(res => {
                    if (!res.status) { document.getElementById('table-barang').innerHTML = '<tr><td colspan="11" class="text-danger">' + (res.message || 'Failed') + '</td></tr>'; return; }
                    const rows = res.data || [];
                    document.getElementById('table-barang').innerHTML = rows.length ? rows.map((b, i) => {
                        const statusBadge = b.status === 'Habis' ? 'bg-danger' : (b.status === 'Menipis' ? 'bg-warning' : 'bg-success');
                        return `
                        <tr>
                            <td class="text-center"><input type="radio" name="pilihBarang" value="${b.id}"></td>
                            <td>${i + 1}</td>
                            <td>${b.kode_barang}</td>
                            <td>${b.nama_barang}</td>
                            <td>${b.kategori || '-'}</td>
                            <td>${b.lokasi || '-'}</td>
                            <td>${b.safety_stock}</td>
                            <td>${b.stok_tersedia}</td>
                            <td><span class="badge ${b.kondisi === 'Rusak' ? 'bg-danger' : 'bg-success'}">${b.kondisi}</span></td>
                            <td><span class="badge ${statusBadge}">${b.status || 'Tersedia'}</span></td>
                            <td class="text-center"><button class="btn btn-primary btn-edit" data-id="${b.id}">Edit</button></td>
                        </tr>`;
                    }).join('') : '<tr><td colspan="11" class="text-center text-muted">No data</td></tr>';
                    document.querySelectorAll('.btn-edit').forEach(btn => {
                        btn.addEventListener('click', () => openEdit(btn.getAttribute('data-id')));
                    });
                })
                .catch(() => document.getElementById('table-barang').innerHTML = '<tr><td colspan="11" class="text-danger">Connection error</td></tr>');
        }
        function openEdit(id) {
            fetch(API + '/barang-detail.php?id=' + id, { credentials: 'same-origin' }).then(r => r.json()).then(res => {
                if (!res.status || !res.data) return;
                const d = res.data;
                document.getElementById('edit_id').value = d.id;
                document.getElementById('edit_kode').value = d.kode_barang;
                document.getElementById('edit_nama').value = d.nama_barang;
                document.getElementById('edit_kategori').value = d.kategori || '';
                document.getElementById('edit_lokasi').value = d.lokasi || '';
                document.getElementById('edit_safety').value = d.safety_stock;
                document.getElementById('edit_stok').value = d.stok_total;
                document.getElementById('edit_stok_tersedia_keep').value = d.stok_tersedia;
                document.getElementById('edit_kondisi').value = d.kondisi || 'Baik';
                document.getElementById('edit_keterangan').value = d.keterangan || '';
                new bootstrap.Modal(document.getElementById('modalEdit')).show();
            });
        }
        document.getElementById('btn-save-edit').addEventListener('click', () => {
            const fd = new FormData();
            fd.append('id', document.getElementById('edit_id').value);
            fd.append('kategori', document.getElementById('edit_kategori').value);
            fd.append('lokasi', document.getElementById('edit_lokasi').value);
            fd.append('stok_total', document.getElementById('edit_stok').value);
            fd.append('safety_stock', document.getElementById('edit_safety').value);
            fd.append('stok_tersedia', document.getElementById('edit_stok_tersedia_keep').value);
            fd.append('kondisi', document.getElementById('edit_kondisi').value);
            fd.append('keterangan', document.getElementById('edit_keterangan').value);
            fetch(API + '/barang-update.php', { method: 'POST', body: fd, credentials: 'same-origin' })
                .then(r => r.json())
                .then(res => {
                    alert(res.message || (res.status ? 'Success' : 'Failed'));
                    if (res.status) { bootstrap.Modal.getInstance(document.getElementById('modalEdit')).hide(); loadBarang(); }
                });
        });
        document.addEventListener('DOMContentLoaded', loadBarang);
    </script>

services:
  app:
    image: lapapp:20260816-production-audit-final
    container_name: app
    env_file:
      - /etc/laporin/laporin-production.env
    volumes:
      - laporin-prod-storage:/var/www/html/storage/app
    networks:
      cf-network:
        aliases:
          - app
    restart: unless-stopped

  worker:
    image: lapapp:20260816-production-audit-final
    container_name: laporin-worker
    env_file:
      - /etc/laporin/laporin-production.env
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php artisan queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    volumes:
      - laporin-prod-storage:/var/www/html/storage/app
    networks:
      - cf-network
    restart: unless-stopped

volumes:
  laporin-prod-storage:
    external: true

networks:
  cf-network:
    external: true

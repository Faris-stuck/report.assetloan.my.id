services:
  app:
    image: lapapp:20260817-logo-fix
    container_name: app
    ports:
      - "127.0.0.1:18080:8080"
    env_file:
      - /etc/laporin/laporin-production.env
    volumes:
      - laporin-prod-storage:/var/www/html/storage/app
    networks:
      cf-network:
        aliases:
          - app
    restart: unless-stopped

  worker:
    image: lapapp:20260817-logo-fix
    container_name: laporin-worker
    env_file:
      - /etc/laporin/laporin-production.env
    command: ["/usr/local/bin/laporin-worker-start"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php artisan queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    volumes:
      - laporin-prod-storage:/var/www/html/storage/app
    networks:
      - cf-network
    restart: unless-stopped

volumes:
  laporin-prod-storage:
    external: true

networks:
  cf-network:
    external: true

    <script>
        function loadLaporanStok() {
            fetch(API_BASE_URL + '/barang/get.php', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(res => {
                    let html = '<h4 class="mb-4">Item Stock Report</h4><table class="table table-hover"><thead class="table-light"><tr>';
                    html += '<th>No</th><th>Code</th><th>Name</th><th>Category</th><th>Total</th><th>Available</th><th>Damaged</th><th>Status</th></tr></thead><tbody>';
                    if (res.data && res.data.length > 0) {
                        res.data.forEach((b, i) => {
                            let badge = b.stok_tersedia <= 0 ? 'bg-danger' : (b.stok_tersedia <= b.safety_stock ? 'bg-warning' : 'bg-success');
                            html += `<tr><td>${i + 1}</td><td>${b.kode_barang}</td><td>${b.nama_barang}</td><td>${b.kategori || '-'}</td><td>${b.stok_total}</td><td>${b.stok_tersedia}</td><td>${b.stok_rusak || 0}</td><td><span class="badge ${badge}">${b.stok_tersedia <= 0 ? 'Out of Stock' : (b.stok_tersedia <= b.safety_stock ? 'Low Stock' : 'OK')}</span></td></tr>`;
                        });
                    } else {
                        html += '<tr><td colspan="8" class="text-center text-muted">No data</td></tr>';
                    }
                    document.querySelector('main .nxl-content').innerHTML = html + '</tbody></table>';
                }).catch(err => console.error(err));
        }
        document.addEventListener('DOMContentLoaded', loadLaporanStok);
    </script>

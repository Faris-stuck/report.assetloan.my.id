services:
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha}
    container_name: ${WAHA_CONTAINER_NAME:-laporin-waha}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      WHATSAPP_API_HOSTNAME: ${WHATSAPP_API_HOSTNAME:-0.0.0.0}
      WHATSAPP_API_PORT: 3000
      WAHA_BASE_URL: ${WAHA_BASE_URL:-https://waha.assetloan.my.id}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WHATSAPP_SWAGGER_ENABLED: ${WHATSAPP_SWAGGER_ENABLED:-true}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WAHA_LOG_FORMAT: ${WAHA_LOG_FORMAT:-JSON}
      WAHA_LOG_LEVEL: ${WAHA_LOG_LEVEL:-info}
      WAHA_HTTP_LOG_LEVEL: ${WAHA_HTTP_LOG_LEVEL:-info}
      WHATSAPP_HOOK_URL: ${WHATSAPP_HOOK_URL:-}
      WHATSAPP_HOOK_EVENTS: ${WHATSAPP_HOOK_EVENTS:-message,message.any,state.change}
      WHATSAPP_HOOK_HMAC_KEY: ${WHATSAPP_HOOK_HMAC_KEY:-}
    ports:
      - "127.0.0.1:${WAHA_PORT:-3001}:3000"
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  waha_sessions:
    name: ${WAHA_VOLUME_NAME:-laporin-waha-sessions}

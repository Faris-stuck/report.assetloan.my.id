<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Komatsu Group Indonesia | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://webassets.komatsugroup.id/favicon.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #03051f, #05082b 60%, #0a0f4a);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            padding: 40px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            text-align: center;
        }

        .logo img {
            width: 160px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #111827;
        }

        .subtitle {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 28px;
            color: #111827;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #f5f7ff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1e3a8a;
            background: #ffffff;
        }

        .password-wrapper {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: #1e3a8a;
            cursor: pointer;
            user-select: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1e3a8a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
        }

        .login-btn:hover {
            background: #162f6a;
        }

        .forgot {
            margin-top: 14px;
            display: block;
            font-size: 14px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 500;
        }

        .footer {
            margin-top: 26px;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">
            <!-- Ganti src sesuai lokasi logo kamu -->
            <img src="../assets/images/Komatsu-Logo-removebg-preview.png" alt="Komatsu Logo">
        </div>

        <div class="title">Komatsu Group Indonesia</div>
        <!-- <div class="subtitle">Business Partner Portal</div>-->

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" name="email" placeholder="email" required>
            </div>

            <div class="form-group password-wrapper">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="********" required>
                <span class="show-password" onclick="togglePassword()">show</span>
            </div>

            <div class="w-100 mt-4 pt-2">
                <button type="submit" class="login-btn">Log in</button>
            </div>

        </form>

        <a href="forgot-password.html" class="forgot">Forgot password</a>
        <a href="register.html" class="forgot">Don't have an account? Register here</a>

        <div class="footer">
            1.2.260112-04 © 2024 - ICT Komatsu Indonesia
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById("password");
            const text = event.target;

            if (input.type === "password") {
                input.type = "text";
                text.innerText = "hide";
            } else {
                input.type = "password";
                text.innerText = "show";
            }
        }

        // Login handler
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("Email and password are required");
                return;
            }

            const formData = new FormData();
            formData.append("email", email);
            formData.append("password", password);

            try {
                const res = await fetch("/PROJECT/api/auth/login.php", {
                    method: "POST",
                    body: formData,
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    alert(err.error || "Login failed. Please check your email/password again.");
                    return;
                }

                const data = await res.json();

                // Save user info to localStorage (can be replaced with PHP session if needed)
                localStorage.setItem("user", JSON.stringify(data));

                // Redirect based on role
                if (data.role === "admin") {
                    window.location.href = "../admin/dashboard.html";
                } else if (data.role === "manager") {
                    window.location.href = "../manager/dashboard.html";
                } else if (data.role === "pic_barang") {
                    window.location.href = "../pic-barang/dashboard.html";
                } else {
                    window.location.href = "../user/dashboard.html";
                }
            } catch (error) {
                alert("A connection error occurred with the server.");
                console.error(error);
            }
        });
    </script>

</body>

</html>

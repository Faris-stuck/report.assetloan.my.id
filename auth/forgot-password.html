<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Komatsu Group Indonesia | Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://webassets.komatsugroup.id/favicon.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #03051f, #05082b 60%, #0a0f4a);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            padding: 40px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            text-align: center;
        }

        .logo img {
            width: 160px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #111827;
        }

        .subtitle {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
            color: #6b7280;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #f5f7ff;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1e3a8a;
            background: #ffffff;
        }

        .password-wrapper {
            position: relative;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: #1e3a8a;
            cursor: pointer;
            user-select: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1e3a8a;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
        }

        .login-btn:hover {
            background: #162f6a;
        }

        .forgot {
            margin-top: 14px;
            display: block;
            font-size: 14px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .footer {
            margin-top: 26px;
            font-size: 12px;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo">
            <img src="../assets/images/Komatsu-Logo-removebg-preview.png" alt="Komatsu Logo">
        </div>

        <div class="title">Reset Password</div>
        <div class="subtitle">Enter your email and new password</div>

        <!-- Alert Messages -->
        <div id="alertBox" class="alert"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="forgotEmail" name="forgot_email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" name="new_password" placeholder="Enter new password" required>
            </div>

            <div class="form-group password-wrapper">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm password"
                    required>
                <span class="show-password" onclick="togglePassword()">show</span>
            </div>

            <div class="w-100 mt-4 pt-2">
                <button type="submit" class="login-btn">Reset Password</button>
            </div>
        </form>

        <a href="login.html" class="forgot">Back to Login</a>

        <div class="footer">
            1.2.260112-04 © 2024 - ICT Komatsu Indonesia
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById("confirmPassword");
            const text = event.target;

            if (input.type === "password") {
                input.type = "text";
                text.innerText = "hide";
            } else {
                input.type = "password";
                text.innerText = "show";
            }
        }

        function showAlert(message, type = "error") {
            const alertBox = document.getElementById("alertBox");
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = "block";
        }

        function clearAlerts() {
            const alertBox = document.getElementById("alertBox");
            alertBox.style.display = "none";
        }

        // Forgot Password handler
        document.getElementById("forgotForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("forgotEmail").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!email || !newPassword || !confirmPassword) {
                showAlert("All fields are required");
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert("Passwords do not match");
                return;
            }

            if (newPassword.length < 6) {
                showAlert("Password must be at least 6 characters");
                return;
            }

            const formData = new FormData();
            formData.append("email", email);
            formData.append("password", newPassword);

            try {
                const res = await fetch("/PROJECT/api/auth/forgot-password.php", {
                    method: "POST",
                    body: formData,
                });

                const data = await res.json();

                if (res.ok && data.status) {
                    showAlert("Password successfully reset. Please login again.", "success");
                    setTimeout(() => {
                        document.getElementById("forgotForm").reset();
                        window.location.href = "login.html";
                    }, 2000);
                } else {
                    showAlert(data.message || "Failed to reset password");
                }
            } catch (error) {
                showAlert("A connection error occurred with the server.");
                console.error(error);
            }
        });
    </script>

</body>

</html>

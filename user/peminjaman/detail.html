<!DOCTYPE html>
<html lang="en">

<head>
    <!--! SESSION VALIDATOR - Must run FIRST before page-guard -->
    <script src="../../assets/js/base-url.js"></script>
    <script src="../../assets/js/auth/session-validator.js"></script>
    <!--! PAGE GUARD - Security: must be first script in head -->
    <script src="../../assets/js/auth/page-guard.js"></script>
    <!--! PAGE GUARD - Security: must be first script in head -->



    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Borrowing Details</title>
    <link rel="stylesheet" type="text/css" href="../../assets/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="../../assets/vendors/css/vendors.min.css" />
    <link rel="stylesheet" type="text/css" href="../../assets/css/theme.min.css" />
    <link rel="stylesheet" href="../../assets/css/custom.css">
</head>

<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Borrowing Details</h3>
            <a class="btn btn-secondary" href="../riwayat.html">Back</a>
        </div>

        <div id="alert" style="display:none" class="alert alert-danger"></div>

        <div id="meta" class="mb-3">
            <p><strong>Code:</strong> <span id="kode"></span></p>
            <p><strong>Loan Date:</strong> <span id="tanggal_pinjam"></span></p>
            <p><strong>Expected Return:</strong> <span id="rencana_kembali"></span></p>
            <p><strong>Status:</strong> <span id="status" class="badge bg-primary"></span></p>
        </div>

        <h5>Item List</h5>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Qty</th>
                    <th>Loan Condition</th>
                    <th>Return Status</th>
                </tr>
            </thead>
            <tbody id="items-body">
            </tbody>
        </table>
    </div>

    <script src="../../assets/js/auth/role-validator.js"></script>
    <script>
        if (typeof RoleValidator !== 'undefined') {
            RoleValidator.requireUser();
        }

        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        // === STATUS DISPLAY HELPERS (database-driven, no hardcode) ===
        function getDisplayStatus(dbStatus) {
            const map = {
                'Waiting for Approval': 'Waiting for Approval',
                'Approved': 'Approved',
                'Partial Approved': 'Partial Approved',
                'Currently Borrowed': 'Currently Borrowed',
                'Returned': 'Returned',
                'Rejected': 'Rejected',
                'Return in Process': 'Return in Process',
                'Partially Returned': 'Partially Returned',
                'Partially Damaged': 'Partially Damaged',
                'Fully Damaged': 'Fully Damaged',
                'Overdue': 'Overdue',
                'Due Today': 'Due Today',
                'Not Yet Returned': 'Not Yet Returned'
            };
            return map[dbStatus] || dbStatus || '-';
        }

        function getStatusBadgeClass(dbStatus) {
            const ds = getDisplayStatus(dbStatus);
            if (ds === 'Overdue' || ds === 'Due Today' || ds === 'Rejected' || ds === 'Fully Damaged' || ds === 'Not Yet Returned' || ds === 'Cancelled') return 'badge bg-danger';
            if (ds.startsWith('Due In') || ds.startsWith('Due in')) return 'badge bg-warning text-dark';
            if (ds === 'Waiting for Approval' || ds === 'Partially Returned' || ds === 'Partially Damaged') return 'badge bg-warning text-dark';
            if (ds === 'Currently Borrowed') return 'badge bg-primary';
            if (ds === 'Return in Process' || ds === 'Partial Approved') return 'badge bg-info text-dark';
            if (ds === 'Returned') return 'badge bg-success';
            return 'badge bg-secondary';
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        const id = getParam('id') || getParam('peminjaman_id');
        if (!id) {
            document.getElementById('alert').style.display = 'block';
            document.getElementById('alert').innerText = 'Borrowing ID not found in query string.';
        } else {
            // Use get_detail_units.php — the per-unit API (same as Extend modal)
            fetch(`${BASE_URL}/api/peminjaman/get_detail_units.php?peminjaman_id=${encodeURIComponent(id)}`, { credentials: 'same-origin' })
                .then(r => {
                    if (r.status === 403) {
                        window.location.href = BASE_URL + '/index.html';
                        throw new Error('unauthorized');
                    }
                    return r.json();
                })
                .then(data => {
                    if (!data.status) {
                        document.getElementById('alert').style.display = 'block';
                        document.getElementById('alert').innerText = data.message || 'Failed to load data.';
                        return;
                    }
                    const d = data.data;
                    document.getElementById('kode').innerText = d.kode_peminjaman || '';
                    document.getElementById('tanggal_pinjam').innerText = d.tanggal_pinjam || '';
                    // Expected return from per-unit data (nearest unreturned unit)
                    document.getElementById('rencana_kembali').innerText = d.expected_return_nearest || d.rencana_kembali || '';
                    // Status directly from API (computed from peminjaman_units)
                    const displayStatus = getDisplayStatus(d.status);
                    const statusEl = document.getElementById('status');
                    statusEl.innerText = displayStatus;
                    statusEl.className = getStatusBadgeClass(d.status);

                    // Render per-unit items table
                    const tbody = document.getElementById('items-body');
                    tbody.innerHTML = '';
                    const units = d.units || [];
                    if (units.length > 0) {
                        units.forEach((u, i) => {
                            const tr = document.createElement('tr');
                            let unitBadge = getStatusBadgeClass(u.return_status);
                            tr.innerHTML = `
                                <td>
                                    <div class="fw-semibold">${escapeHtml(u.nama_barang)}</div>
                                    <div class="small text-muted"><code>${escapeHtml(u.kode_barang)}</code></div>
                                </td>
                                <td>1</td>
                                <td>${escapeHtml(u.kondisi_pinjam || '')}</td>
                                <td><span class="${unitBadge}">${escapeHtml(u.return_status)}</span></td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No items</td></tr>';
                    }
                })
                .catch(err => console.error(err));
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Test - Debug Console</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #c0c0c0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #4ec9b0;
            margin-bottom: 20px;
        }

        .test-section {
            background: #252526;
            border: 1px solid #3e3e42;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .test-section h2 {
            color: #569cd6;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
        }

        button:hover {
            background: #1177bb;
        }

        button.danger {
            background: #d13438;
        }

        button.danger:hover {
            background: #f14547;
        }

        .output {
            background: #1e1e1e;
            border: 1px solid #569cd6;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-success {
            color: #4ec9b0;
        }

        .log-error {
            color: #f48771;
        }

        .log-info {
            color: #569cd6;
        }

        .log-warn {
            color: #dcdcaa;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 4px;
        }

        .status-item {
            margin-bottom: 5px;
        }

        .status-label {
            color: #569cd6;
            min-width: 150px;
            display: inline-block;
        }

        .status-value {
            color: #4ec9b0;
        }

        .status-value.error {
            color: #f48771;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 Logout Flow Test Console</h1>

        <div class="test-section">
            <h2>📋 Session & Storage Status</h2>
            <div class="status" id="statusContainer"></div>
        </div>

        <div class="test-section">
            <h2>🧪 Test Actions</h2>
            <button onclick="testLogoutButton()">Test Logout Button Click</button>
            <button onclick="checkLogoutElements()">Check [data-logout] Elements</button>
            <button onclick="testConsoleLogging()">Test Console Logging</button>
            <button onclick="testLocalStorage()">Test Local Storage</button>
            <button onclick="testServerConnection()">Test Server Connection</button>
            <button class="danger" onclick="simulateLogout()">Simulate Full Logout</button>
            <button onclick="clearLogs()">Clear Logs</button>
            <div id="logOutput" class="output"></div>
        </div>

        <div class="test-section">
            <h2>⚙️ Logout Configuration Check</h2>
            <div id="configCheck" class="output"></div>
        </div>
    </div>

    <script>
        // Logging system
        const logs = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('id-ID');
            const icon = {
                info: 'ℹ️',
                success: '✅',
                error: '❌',
                warn: '⚠️'
            }[type] || '•';

            const logEntry = `[${timestamp}] ${icon} ${message}`;
            logs.push(logEntry);

            const output = document.getElementById('logOutput');
            if (output) {
                const span = document.createElement('span');
                span.className = `log-${type}`;
                span.textContent = logEntry + '\n';
                output.appendChild(span);
                output.scrollTop = output.scrollHeight;
            }

            console.log(message);
        }

        function clearLogs() {
            logs.length = 0;
            const output = document.getElementById('logOutput');
            if (output) output.innerHTML = '';
            addLog('Logs cleared', 'info');
        }

        // Update status
        function updateStatus() {
            const status = document.getElementById('statusContainer');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const role = localStorage.getItem('role');
            const hasSession = !!document.cookie.includes('PHPSESSID');

            status.innerHTML = `
                <div class="status-item">
                    <span class="status-label">User Logged In:</span>
                    <span class="status-value ${user && user.id ? 'success' : 'error'}">
                        ${user && user.id ? `Yes (ID: ${user.id})` : 'No'}
                    </span>
                </div>
                <div class="status-item">
                    <span class="status-label">User Role:</span>
                    <span class="status-value">${role || 'Not set'}</span>
                </div>
                <div class="status-item">
                    <span class="status-label">LocalStorage User:</span>
                    <span class="status-value ${user && user.id ? 'success' : 'error'}">
                        ${JSON.stringify(user).substring(0, 50)}...
                    </span>
                </div>
                <div class="status-item">
                    <span class="status-label">Session ID via Cookie:</span>
                    <span class="status-value ${hasSession ? 'success' : 'error'}">
                        ${hasSession ? 'Detected' : 'Not detected'}
                    </span>
                </div>
            `;
        }

        // Test functions
        function testLogoutButton() {
            addLog('Testing logout button detection...', 'info');

            const elements = document.querySelectorAll('[data-logout]');
            if (elements.length > 0) {
                addLog(`Found ${elements.length} elements with [data-logout] attribute`, 'success');
                elements.forEach((el, i) => {
                    addLog(`  Element ${i + 1}: ${el.tagName} - ${el.className}`, 'info');

                    // Test click
                    el.addEventListener('click', (e) => {
                        addLog(`  Logout button ${i + 1} was clicked!`, 'success');
                        e.preventDefault();
                        addLog('Default action prevented', 'success');
                    }, { once: true });
                });
            } else {
                addLog('No [data-logout] elements found!', 'error');
            }
        }

        function checkLogoutElements() {
            addLog('Checking page for logout buttons...', 'info');

            const selectors = [
                '[data-logout]',
                'a.logout',
                'button.logout',
                '[class*="logout"]'
            ];

            let found = 0;
            selectors.forEach(sel => {
                const els = document.querySelectorAll(sel);
                if (els.length > 0) {
                    addLog(`Found ${els.length} elements matching "${sel}"`, 'success');
                    found += els.length;
                }
            });

            if (found === 0) {
                addLog('No logout-related elements found on this page', 'error');
            }
        }

        function testConsoleLogging() {
            addLog('Testing console logging...', 'info');

            console.log('✅ info log');
            console.error('❌ Error log test');
            console.warn('⚠️ Warning log test');

            addLog('Check browser console (F12) for additional logging', 'info');
        }

        function testLocalStorage() {
            addLog('Testing localStorage...', 'info');

            try {
                localStorage.setItem('test', 'value');
                const val = localStorage.getItem('test');
                localStorage.removeItem('test');

                if (val === 'value') {
                    addLog('localStorage is working correctly', 'success');
                } else {
                    addLog('localStorage retrieval failed', 'error');
                }
            } catch (e) {
                addLog(`localStorage error: ${e.message}`, 'error');
            }
        }

        function testServerConnection() {
            addLog('Testing server connection to /PROJECT/api/auth/logout.php...', 'info');

            fetch('/PROJECT/api/auth/logout.php', {
                method: 'OPTIONS'
            })
                .then(response => {
                    addLog(`Server responded with status ${response.status}`, 'success');
                })
                .catch(error => {
                    addLog(`Server connection error: ${error.message}`, 'error');
                });
        }

        function simulateLogout() {
            addLog('⚠️ SIMULATING FULL LOGOUT FLOW...', 'warn');

            // Step 1: Clear localStorage
            addLog('Step 1: Clearing localStorage...', 'info');
            localStorage.removeItem('user');
            localStorage.removeItem('role');
            localStorage.removeItem('userId');
            localStorage.removeItem('token');
            addLog('  ✅ localStorage cleared', 'success');

            // Step 2: Clear sessionStorage
            addLog('Step 2: Clearing sessionStorage...', 'info');
            sessionStorage.clear();
            addLog('  ✅ sessionStorage cleared', 'success');

            // Step 3: Call logout API
            addLog('Step 3: Calling /PROJECT/api/auth/logout.php...', 'info');
            fetch('/PROJECT/api/auth/logout.php', {
                method: 'POST',
                credentials: 'include'
            })
                .then(r => r.json())
                .then(res => {
                    if (res.status) {
                        addLog('  ✅ Server logout successful', 'success');
                        addLog(`  Message: ${res.message}`, 'success');
                    } else {
                        addLog(`  ❌ Server error: ${res.message}`, 'error');
                    }
                })
                .catch(e => {
                    addLog(`  ⚠️ Server call failed: ${e.message}`, 'warn');
                })
                .finally(() => {
                    addLog('Logout simulation complete. You can now navigate manually to index.html', 'info');
                    updateStatus();
                });
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            addLog('Test page loaded', 'success');
            updateStatus();
            checkLogoutElements();
        });

        // Update status periodically
        setInterval(updateStatus, 2000);
    </script>
</body>

</html>
